    background-position:center 42%;
    background-repeat:no-repeat;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 26px 0;
    gap:12px;
  }
  .status-pill{
    display:flex;
    align-items:center;
    gap:9px;
    background:rgba(20,12,18,0.45);
    border:1px solid rgba(246,237,224,0.18);
    backdrop-filter:blur(6px);
    padding:8px 16px 8px 12px;
    border-radius:999px;
    font-size:15px;
    letter-spacing:0.03em;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 0 0 rgba(255,90,54,0.6);
    animation:pulse-dot 2.2s infinite;
  }
  @keyframes pulse-dot{
    0%{box-shadow:0 0 0 0 rgba(255,90,54,0.55);}
    70%{box-shadow:0 0 0 9px rgba(255,90,54,0);}
    100%{box-shadow:0 0 0 0 rgba(255,90,54,0);}
  }
  .status-pill b{color:var(--cream); font-weight:600;}
  .status-pill span.count{color:var(--gold); font-weight:700;}

  .route-chip{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .route-code{
    font-weight:700;
    font-size:15px;
    letter-spacing:0.08em;
    background:var(--ember);
    color:#1a0f10;
    padding:7px 12px;
    border-radius:6px;
    box-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  .yt-link{
    display:flex;align-items:center;gap:6px;
    color:var(--cream);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    border:1px solid rgba(246,237,224,0.25);
    padding:8px 13px;
    border-radius:999px;
    background:rgba(20,12,18,0.4);
    backdrop-filter:blur(6px);
    transition:background .2s, border-color .2s;
  }
  .yt-link:hover{ background:rgba(255,90,54,0.25); border-color:var(--ember); }
  .yt-link svg{width:15px;height:15px;flex:none;}

  /* ---------- hero ---------- */
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:14vh 20px 20px;
  }
  .wordmark{
    font-family:'Yatra One', cursive;
    font-size:clamp(34px, 6.5vw, 60px);
    line-height:1.06;
    margin:0;
    color:var(--cream);
    text-shadow:0 6px 40px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.3);
    letter-spacing:0.01em;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wordmark span{ display:block; }
  .wordmark .accent{ color:var(--ember); }
  .translit{
    margin:14px 0 0;
    font-weight:700;
    font-size:clamp(13px,2.2vw,17px);
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .tagline{
    margin:16px 0 0;
    max-width:540px;
    font-size:clamp(16px,2.6vw,20px);
    font-weight:500;
    color:var(--cream-dim);
    line-height:1.55;
  }
  .tagline em{ color:var(--cream); font-style:normal; font-weight:700; }

  /* ---------- destination dropdown ---------- */
  .dest-box{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .dest-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .dest-select-wrap{
    position:relative;
    width:min(88vw, 360px);
  }
  .dest-select{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--cream);
    background:rgba(20,12,18,0.55);
    border:1px solid rgba(246,237,224,0.28);
    backdrop-filter:blur(8px);
    padding:13px 42px 13px 18px;
    border-radius:12px;
    cursor:pointer;
    text-align:left;
    box-shadow:0 8px 22px rgba(0,0,0,0.35);
    transition:border-color .2s, background .2s;
  }
  .dest-select:hover{ border-color:rgba(255,90,54,0.6); }
  .dest-select:focus{ outline:none; border-color:var(--ember); }
  .dest-select option{
    background:#1c1220;
    color:var(--cream);
  }
  .dest-select-wrap::after{
    content:"";
    position:absolute;
    right:16px; top:50%;
    width:10px; height:10px;
    border-right:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  .info-row{
    margin-top:22px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:center;
  }
  .track-count{
    font-size:14px;
    letter-spacing:0.05em;
    color:var(--cream-dim);
    border:1px solid rgba(246,237,224,0.22);
    padding:9px 16px;
    border-radius:999px;
    background:rgba(20,12,18,0.35);
    backdrop-filter:blur(6px);
  }
  .track-count b{color:var(--cream); font-weight:700;}
  .cta{
    display:flex;align-items:center;gap:8px;
    background:var(--ember);
    color:#1c0e0c;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    padding:11px 20px;
    border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,0.35), 0 10px 24px rgba(255,90,54,0.25);
    transition:transform .15s ease;
  }
  .cta:hover{ transform:translateY(-2px); }
  .cta:active{ transform:translateY(1px); box-shadow:0 2px 0 rgba(0,0,0,0.35); }
  .cta svg{width:15px;height:15px;}

  /* ---------- floating dock (player + horn) ---------- */

  /* ---------- horn button (left side, floating) ---------- */
  .horn-wrap{
    position:fixed;
    left:26px;
    bottom:150px;
    z-index:40;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .horn-btn{
    position:relative;
    width:50px;height:50px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:
      radial-gradient(circle at 33% 28%, #ff8f66 0%, var(--ember) 46%, var(--ember-2) 80%, #8f2818 100%);
    box-shadow:
      0 0 0 3px rgba(20,12,18,0.7),
      0 0 0 4px rgba(246,237,224,0.16),
      0 6px 16px rgba(0,0,0,0.55),
      inset 0 2px 4px rgba(255,255,255,0.32),
      inset 0 -5px 9px rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s ease;
  }
  .horn-btn svg{ width:21px;height:21px; fill:#3a1a14; filter:drop-shadow(0 1px 0 rgba(255,255,255,0.22)); }
  .horn-btn:active{ transform:scale(0.9); }
  .horn-btn.honking{ animation:honk-shake .35s ease; }
  @keyframes honk-shake{
    0%,100%{ transform:translate(0,0) scale(1); }
    25%{ transform:translate(-1.5px,1px) scale(0.97); }
    50%{ transform:translate(1.5px,-1px) scale(0.97); }
    75%{ transform:translate(-1px,1px) scale(0.98); }
  }
  .horn-label{
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.16em;
    color:var(--cream-dim);
    text-transform:uppercase;
  }
  .ripple{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid rgba(255,182,72,0.9);
    opacity:0;
    pointer-events:none;
  }
  .ripple.go{ animation:ripple-out .7s ease-out; }
  @keyframes ripple-out{
    0%{ opacity:0.9; transform:scale(1); }
    100%{ opacity:0; transform:scale(2.15); }
  }

  /* ---------- floating player pill ---------- */
  .player-bar{
    position:fixed;
    left:50%;
    bottom:38px;
    transform:translateX(-50%);
    width:min(92vw, 400px);
    z-index:30;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px 8px 8px;
    border-radius:18px;
    background:var(--glass-2);
    backdrop-filter:blur(16px);
    border:1px solid rgba(246,237,224,0.14);
    box-shadow:0 14px 34px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .thumb{
    width:38px;height:38px;
    border-radius:9px;
    flex:none;
    background:linear-gradient(135deg, var(--violet), var(--bg-dusk)) center/cover;
    box-shadow:0 2px 8px rgba(0,0,0,0.5);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .thumb img{ width:100%;height:100%;object-fit:cover; display:block; }
  .track-meta{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .track-title-mask{
    overflow:hidden;
    white-space:nowrap;
    max-width:100%;
  }
  .track-title{
    display:inline-block;
    font-weight:700;
    font-size:12.5px;
    color:var(--cream);
    padding-right:40px;
  }
  .track-title.scroll{ animation:marquee 12s linear infinite; }
  @keyframes marquee{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-50%); }
  }
  .now-playing-label{
    font-size:9px;
    letter-spacing:0.1em;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .time{ font-size:10px; color:var(--cream-dim); font-variant-numeric:tabular-nums; flex:none; min-width:26px; }
  .bar-track{
    flex:1;
    height:4px;
    border-radius:999px;
    background:rgba(246,237,224,0.18);
    position:relative;
    cursor:pointer;
    overflow:hidden;
  }
  .bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background:linear-gradient(90deg, var(--gold), var(--ember));
    border-radius:999px;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:3px;
    flex:none;
  }
  .ctrl-btn{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid rgba(246,237,224,0.18);
    background:rgba(246,237,224,0.06);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .ctrl-btn:hover{ background:rgba(255,90,54,0.28); }
  .ctrl-btn:active{ transform:scale(0.92); }
  .ctrl-btn svg{ width:12px;height:12px; fill:currentColor; }
  .play-btn{
    width:32px;height:32px;
    background:var(--ember);
    border:none;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
  }
  .play-btn:hover{ background:var(--ember-2); }
  .play-btn svg{ width:13px;height:13px; fill:#1c0e0c; }

  #yt-music, #yt-horn{
    position:absolute;
    width:2px;height:2px;
    opacity:0;
    pointer-events:none;
    bottom:0; right:0;
  }

  @media (max-width:640px){
    .topbar{ padding:16px 14px 0; }
    .status-pill{ font-size:12px; padding:6px 11px 6px 9px; }
    .route-chip{ gap:6px; }
    .yt-link span.full{ display:none; }
    .horn-wrap{ left:14px; bottom:118px; }
    .horn-btn{ width:44px;height:44px; }
    .horn-btn svg{ width:18px;height:18px; }
    .horn-label{ font-size:8.5px; }
    .player-bar{ bottom:20px; width:94vw; padding:6px 10px 6px 6px; gap:8px; border-radius:16px; }
    .thumb{ width:34px;height:34px; }
    .track-title{ font-size:11.5px; }
    .now-playing-label{ font-size:8px; }
    .ctrl-btn{ width:24px;height:24px; }
    .ctrl-btn svg{ width:11px;height:11px; }
    .play-btn{ width:29px;height:29px; }
    .track-count{ font-size:12px; }
    .cta{ font-size:13px; padding:9px 16px; }
    .dest-box{ margin-top:20px; }
    .dest-select{ font-size:14px; padding:11px 38px 11px 15px; }
    .dest-label{ font-size:11px; }
  }

  @media (prefers-reduced-motion:reduce){
    .dot, .horn-btn.honking, .ripple.go, .track-title.scroll{ animation:none !important; }
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
</style>
</head>
<body>

<div class="stage">

  <div class="topbar">
    <div class="status-pill">
      <span class="dot"></span>
      <b>ON AIR</b>&nbsp;·&nbsp;<span class="count" id="listenerCount">142</span>&nbsp;listening
    </div>
    <div class="route-chip">
      <a class="yt-link" href="https://youtube.com/playlist?list=PLcG1018LuCXo&si=w8hFgu1FdDPiX_9o" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M23.5 6.2s-.2-1.6-1-2.3c-.9-1-1.9-1-2.4-1.1C16.6 2.5 12 2.5 12 2.5h0s-4.6 0-8.1.3c-.5 0-1.5.1-2.4 1.1-.7.7-1 2.3-1 2.3S0 8.1 0 10v1.9c0 1.9.2 3.8.2 3.8s.2 1.6 1 2.3c.9 1 2.1.9 2.6 1 1.9.2 8.2.3 8.2.3s4.6 0 8.1-.3c.5 0 1.5-.1 2.4-1.1.7-.7 1-2.3 1-2.3s.2-1.9.2-3.8V10c0-1.9-.2-3.8-.2-3.8zM9.5 14.5v-7l6.3 3.5-6.3 3.5z"/></svg>
        <span class="full">View playlist</span>
      </a>
      <span class="route-code">NY–108</span>
    </div>
  </div>

  <div class="hero">
    <h1 class="wordmark"><span>नेपाल</span><span class="accent">यातायात</span></h1>

    <div class="dest-box">
      <span class="dest-label">Destination</span>
      <div class="dest-select-wrap">
        <select class="dest-select" id="destSelect" aria-label="Choose your destination">
          <option value="" disabled selected>Select a route</option>
          <option value="arghakhanchi">Kathmandu — Arghakhanchi</option>
          <option value="butwal">Kathmandu — Butwal</option>
          <option value="gulmi">Kathmandu — Gulmi</option>
          <option value="parbat">Kathmandu — Parbat</option>
          <option value="syangja">Kathmandu — Syangja</option>
          <option value="syangja">Butwal — Arghakhanchi</option>
          <option value="syangja">Butwal — Syangja</option>
        </select>
      </div>
    </div>
  </div>

  <div class="horn-wrap">
    <button class="horn-btn" id="hornBtn" aria-label="Honk the bus horn">
      <span class="ripple" id="hornRipple"></span>
      <svg viewBox="0 0 24 24">
        <circle cx="6" cy="12" r="3.4" fill="#3a1a14"/>
        <path d="M8.3 9.3 19 4.8v14.4L8.3 14.7V9.3z" fill="#3a1a14"/>
      </svg>
    </button>
    <span class="horn-label">Horn</span>
  </div>

  <div class="player-bar">
    <div class="thumb" id="thumbBox">
      <img id="thumbImg" alt="" />
    </div>
    <div class="track-meta">
      <span class="now-playing-label" id="npLabel">Tuning in…</span>
      <div class="track-title-mask">
        <span class="track-title" id="trackTitle">Nepal Yatayat Radio</span>
      </div>
      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <div class="bar-track" id="barTrack"><span class="bar-fill" id="barFill"></span></div>
        <span class="time" id="durTime">0:00</span>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" aria-label="Play or pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-3.5 6L4 6v12z"/></svg>
      </button>
    </div>
  </div>

</div>

<div id="yt-music"></div>
<div id="yt-horn"></div>

<script>
  // ---------- destination selector ----------
  (function(){
    const sel = document.getElementById('destSelect');
    const code = document.querySelector('.route-code');
    const codes = {
      arghakhanchi: 'NY–201',
      butwal: 'NY–108',
      gulmi: 'NY–304',
      parbat: 'NY–415',
      syangja: 'NY–522'
    };
    sel.addEventListener('change', ()=>{
      if(code && codes[sel.value]) code.textContent = codes[sel.value];
    });
  })();

  // ---------- listener count ambience ----------
  (function(){
    const el = document.getElementById('listenerCount');
    let n = 142;
    setInterval(()=>{
      n += Math.round((Math.random()-0.5)*6);
      if(n < 60) n = 60;
      el.textContent = n;
    }, 3400);
  })();

  // ---------- YouTube IFrame API ----------
  let musicPlayer, hornPlayer, musicReady = false, hornReady = false;
  let isPlaying = false;
  let progressTimer = null;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function onYouTubeIframeAPIReady(){
    musicPlayer = new YT.Player('yt-music', {
      height:'2', width:'2',
      playerVars:{
        listType:'playlist',
        list:'PLcG1018LuCXo',
        autoplay:0,
        controls:0,
        rel:0
      },
      events:{
        onReady: ()=>{ musicReady = true; },
        onStateChange: onMusicStateChange
      }
    });

    hornPlayer = new YT.Player('yt-horn', {
      height:'2', width:'2',
      videoId:'P2Iw_y2Gya0',
      playerVars:{ autoplay:0, controls:0, rel:0 },
      events:{
        onReady: ()=>{ hornReady = true; }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function fmt(t){
    if(!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ':' + (s<10?'0':'') + s;
  }

  function updateTrackInfo(){
    try{
      const data = musicPlayer.getVideoData();
      const title = (data && data.title) ? data.title : 'नेपाल यातायात रेडियो';
      const titleEl = document.getElementById('trackTitle');
      titleEl.textContent = title;
      titleEl.classList.toggle('scroll', title.length > 34);
      const vid = data && data.video_id;
      if(vid){
        document.getElementById('thumbImg').src = 'https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg';
      }
    }catch(e){}
  }

  function onMusicStateChange(e){
    const npLabel = document.getElementById('npLabel');
    if(e.data === YT.PlayerState.PLAYING){
      isPlaying = true;
      setPlayIcon(true);
      npLabel.textContent = 'बज्दै — Now Playing';
      updateTrackInfo();
      startProgress();
    } else if(e.data === YT.PlayerState.PAUSED){
      isPlaying = false;
      setPlayIcon(false);
      npLabel.textContent = 'रोकिएको — Paused';
    } else if(e.data === YT.PlayerState.BUFFERING){
      npLabel.textContent = 'लोड हुँदै…';
    } else if(e.data === YT.PlayerState.CUED){
      updateTrackInfo();
    }
  }

  function setPlayIcon(playing){
    const icon = document.getElementById('playIcon');
    icon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function startProgress(){
    clearInterval(progressTimer);
    progressTimer = setInterval(()=>{
      if(!musicReady) return;
      try{
        const cur = musicPlayer.getCurrentTime() || 0;
        const dur = musicPlayer.getDuration() || 0;
        document.getElementById('curTime').textContent = fmt(cur);
        document.getElementById('durTime').textContent = fmt(dur);
        document.getElementById('barFill').style.width = dur ? ((cur/dur)*100)+'%' : '0%';
      }catch(e){}
    }, 500);
  }

  document.getElementById('playBtn').addEventListener('click', ()=>{
    if(!musicReady) return;
    if(isPlaying){ musicPlayer.pauseVideo(); }
    else{ musicPlayer.playVideo(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(musicReady) musicPlayer.nextVideo();
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(musicReady) musicPlayer.previousVideo();
  });
  document.getElementById('barTrack').addEventListener('click', (e)=>{
    if(!musicReady) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const dur = musicPlayer.getDuration() || 0;
    musicPlayer.seekTo(dur * pct, true);
  });

  // ---------- horn button ----------
  const hornBtn = document.getElementById('hornBtn');
  const hornRipple = document.getElementById('hornRipple');
  let hornTimeout = null;

  hornBtn.addEventListener('click', ()=>{
    hornBtn.classList.remove('honking');
    void hornBtn.offsetWidth;
    hornBtn.classList.add('honking');

    hornRipple.classList.remove('go');
    void hornRipple.offsetWidth;
    hornRipple.classList.add('go');

    if(navigator.vibrate) navigator.vibrate(60);

    if(hornReady){
      try{
        hornPlayer.seekTo(0, true);
        hornPlayer.setVolume(100);
        hornPlayer.playVideo();
      }catch(e){}
      clearTimeout(hornTimeout);
      hornTimeout = setTimeout(()=>{
        try{ hornPlayer.pauseVideo(); }catch(e){}
      }, 4300);
    }
  });
</script>

</body>
</html>
